# Arguments of the native build of the agent (native/build.sh: native-image -jar dc-agent.jar).
# -march=compatibility: Native Image 25 defaults to x86-64-v3, which an older EL9 host's CPU may
#   not run; the binary must start on every x86_64 host of the fleet.
# -R:MaxHeapSize=256m: the same heap as the JVM agent's -Xmx256m; -Xmx at start still overrides it.
Args = --no-fallback \
       -march=compatibility \
       -H:+ReportExceptionStackTraces \
       --enable-url-protocols=http,https \
       -R:MaxHeapSize=256m
