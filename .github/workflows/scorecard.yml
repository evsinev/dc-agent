name: Scorecard supply-chain security

on:
  # Recompute when branch-protection settings change, weekly, and on push to the
  # default branch. NOT on pull_request — Scorecard fails/does nothing useful there
  # and it would run on every Dependabot PR.
  branch_protection_rule:
  schedule:
    - cron: '31 4 * * 1'   # weekly, Monday 04:31 UTC
  push:
    branches: [ master ]

# Minimal default; the job below elevates only what Scorecard needs.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF results
      id-token: write          # publish_results (OIDC to the OpenSSF API)
      contents: read
      actions: read            # some checks query the Actions API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
